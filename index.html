<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC-Con-201 Flashcards</title>
    <style>
        :root {
            --primary-color: #00A1E0; 
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-light: #666666;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 600px;
            padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column;
            height: 100%;
        }

        header { margin-bottom: 15px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 1.3rem; margin: 0; color: var(--primary-color); }

        .mode-toggle {
            display: flex; background: #e0e0e0; border-radius: 30px;
            position: relative; margin-bottom: 5px;
        }
        .mode-toggle input[type="radio"] { display: none; }
        .mode-toggle label {
            flex: 1; text-align: center; padding: 10px; font-size: 0.9rem;
            font-weight: 600; cursor: pointer; z-index: 1; transition: color 0.3s; color: var(--text-light);
        }
        .mode-toggle input[type="radio"]:checked + label { color: white; }
        .toggle-bg {
            position: absolute; top: 0; left: 0; height: 100%; width: 50%;
            background-color: var(--primary-color); border-radius: 30px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 0;
        }
        #mode-study:checked ~ .toggle-bg { transform: translateX(0); }
        #mode-test:checked ~ .toggle-bg { transform: translateX(100%); }

        .flip-hint { text-align: center; font-size: 0.8rem; color: #999; margin-bottom: 10px; height: 15px; }

        .card-wrapper {
            flex: 1; position: relative; margin-bottom: 15px;
            perspective: 1000px; cursor: pointer; min-height: 0;
        }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            background: var(--card-bg); border-radius: var(--border-radius);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 20px; box-sizing: border-box;
            overflow-y: auto; display: flex; flex-direction: column; border: 1px solid #eaeaea;
        }
        .card-back {
            transform: rotateY(180deg); background: #f8fbff; border: 2px solid var(--primary-color);
        }

        .card-wrapper.test-mode .card-inner.flipped { transform: rotateY(180deg); }

        .card-wrapper.study-mode { perspective: none; overflow-y: auto; display: block; }
        .card-wrapper.study-mode .card-inner {
            transform: none !important; transition: none; transform-style: flat;
            display: flex; flex-direction: column; height: auto;
        }
        .card-wrapper.study-mode .card-front {
            position: relative; height: auto; min-height: 150px; backface-visibility: visible;
        }
        .card-wrapper.study-mode .card-back {
            position: relative; height: auto; transform: none; display: none;
            margin-top: 10px; backface-visibility: visible;
        }
        .card-wrapper.study-mode .card-inner.show-answer .card-back { display: flex; }

        .tag {
            display: inline-block; background: #e3f2fd; color: var(--primary-color);
            padding: 4px 10px; border-radius: 12px; font-size: 0.8rem;
            font-weight: bold; margin-bottom: 12px; align-self: flex-start;
        }
        .question-text { font-size: 1.05rem; line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; }
        .answer-text { font-size: 1.05rem; line-height: 1.5; font-weight: 600; color: var(--primary-color); margin-bottom: 12px; white-space: pre-wrap; }
        .explanation-text { font-size: 0.95rem; line-height: 1.5; color: var(--text-light); white-space: pre-wrap; }

        .controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px 0; }
        .btn {
            background: var(--card-bg); border: 1px solid #ddd; color: var(--text-color);
            padding: 12px 20px; border-radius: 30px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.05); touch-action: manipulation;
        }
        .btn:active { transform: scale(0.95); background: #f0f0f0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress { font-size: 1rem; font-weight: bold; color: var(--primary-color); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-top">
            <h1>MC-Con-201 학습 앱</h1>
        </div>
        <div class="mode-toggle">
            <input type="radio" name="mode" id="mode-study" value="study" onchange="changeMode()">
            <label for="mode-study">학습 모드</label>
            <input type="radio" name="mode" id="mode-test" value="test" checked onchange="changeMode()">
            <label for="mode-test">테스트 모드</label>
            <div class="toggle-bg"></div>
        </div>
    </header>

    <div class="flip-hint" id="flip-hint">카드를 탭해서 뒤집기 (좌우 스와이프로 이동)</div>

    <div id="card-wrapper" class="card-wrapper test-mode" onclick="flipCard()">
        <div class="card-inner" id="card-inner">
            <div class="card-front">
                <span class="tag" id="q-number">대기 중</span>
                <div class="question-text" id="front-text">데이터를 불러오는 중입니다...</div>
            </div>
            <div class="card-back">
                <span class="tag">정답 및 해설</span>
                <div class="answer-text" id="back-answer"></div>
                <div class="explanation-text" id="back-explanation"></div>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" id="btn-prev" onclick="prevCard()">◀ 이전</button>
        <div class="progress" id="progress-text">0 / 0</div>
        <button class="btn" id="btn-next" onclick="nextCard()">다음 ▶</button>
    </div>
</div>

<script>
    let flashcardsData = [];
    let currentIndex = 0;
    let isStudyMode = false;
    let isFlipped = false;

    const wrapper = document.getElementById('card-wrapper');
    const inner = document.getElementById('card-inner');
    const qNumberEl = document.getElementById('q-number');
    const frontTextEl = document.getElementById('front-text');
    const backAnswerEl = document.getElementById('back-answer');
    const backExplanationEl = document.getElementById('back-explanation');
    const progressEl = document.getElementById('progress-text');
    const hintEl = document.getElementById('flip-hint');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // 페이지 로드 시 data.json 파일을 자동으로 불러옵니다.
    async function loadData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('네트워크 응답이 정상적이지 않습니다.');
            flashcardsData = await response.json();
            updateCard();
        } catch (error) {
            frontTextEl.textContent = "데이터를 불러오지 못했습니다. 동일한 경로에 data.json 파일이 있는지 확인해주세요.";
        }
    }

    function updateCard() {
        if (flashcardsData.length === 0) return;
        const card = flashcardsData[currentIndex];
        qNumberEl.textContent = `NO. ${card.qNum || (currentIndex + 1)}`;
        frontTextEl.textContent = card.front;
        backAnswerEl.textContent = card.answer;
        backExplanationEl.textContent = card.explanation;
        
        progressEl.textContent = `${currentIndex + 1} / ${flashcardsData.length}`;
        
        btnPrev.disabled = currentIndex === 0;
        btnNext.disabled = currentIndex === flashcardsData.length - 1;

        isFlipped = false;
        inner.classList.remove('flipped');
        inner.classList.remove('show-answer');
    }

    function changeMode() {
        const studyRadio = document.getElementById('mode-study');
        isStudyMode = studyRadio.checked;
        
        if (isStudyMode) {
            wrapper.classList.replace('test-mode', 'study-mode');
            hintEl.textContent = "카드 박스를 탭하면 정답이 나타납니다 (좌우 스와이프로 이동)";
        } else {
            wrapper.classList.replace('study-mode', 'test-mode');
            hintEl.textContent = "카드를 탭해서 3D로 뒤집기 (좌우 스와이프로 이동)";
        }
        isFlipped = false;
        inner.classList.remove('flipped');
        inner.classList.remove('show-answer');
        wrapper.scrollTop = 0;
    }

    function flipCard() {
        if (isStudyMode) {
            inner.classList.toggle('show-answer');
        } else {
            isFlipped = !isFlipped;
            if (isFlipped) inner.classList.add('flipped');
            else inner.classList.remove('flipped');
        }
    }

    function nextCard() {
        if (currentIndex < flashcardsData.length - 1) {
            currentIndex++;
            updateCard();
            if (isStudyMode) wrapper.scrollTop = 0;
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
            if (isStudyMode) wrapper.scrollTop = 0;
        }
    }

    /* 스와이프 제스처 */
    let touchstartX = 0; let touchendX = 0;
    wrapper.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
    wrapper.addEventListener('touchend', e => {
        touchendX = e.changedTouches[0].screenX;
        const swipeThreshold = 40;
        if (touchendX < touchstartX - swipeThreshold) nextCard(); 
        if (touchendX > touchstartX + swipeThreshold) prevCard(); 
    }, {passive: true});

    /* 키보드 제어 */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === ' ') {
            e.preventDefault();
            flipCard();
        }
    });

    // 앱 실행
    window.onload = loadData;
</script>

</body>
</html>
