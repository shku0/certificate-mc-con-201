<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC-Con-201 학습 및 실전 모의고사</title>
    <style>
        :root {
            --primary-color: #00A1E0;
            --primary-light: #e3f2fd;
            --primary-dark: #0077a8;
            --success-color: #2e7d32;
            --success-bg: #e8f5e9;
            --error-color: #c62828;
            --error-bg: #ffebee;
            --star-color: #f59e0b;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #222222;
            --text-light: #555555;
            --border-radius: 16px;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 680px;
            padding: 16px 20px; box-sizing: border-box;
            display: flex; flex-direction: column;
            height: 100%;
        }

        header { margin-bottom: 14px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: 1.25rem; margin: 0; color: var(--primary-color); }

        .btn-import {
            background: var(--card-bg); border: 1px solid #ddd;
            color: var(--text-light); padding: 6px 12px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-import:hover { color: var(--primary-color); border-color: var(--primary-color); }

        /* 모드 전환 토글 */
        .mode-toggle {
            display: flex; background: #e0e0e0; border-radius: 30px;
            position: relative;
        }
        .mode-toggle input[type="radio"] { display: none; }
        .mode-toggle label {
            flex: 1; text-align: center; padding: 10px; font-size: 0.9rem;
            font-weight: 700; cursor: pointer; z-index: 1; transition: color 0.3s; color: var(--text-light);
        }
        .mode-toggle input[type="radio"]:checked + label { color: white; }
        .toggle-bg {
            position: absolute; top: 0; left: 0; height: 100%; width: 50%;
            background-color: var(--primary-color); border-radius: 30px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 0;
        }
        #mode-study:checked ~ .toggle-bg { transform: translateX(0); }
        #mode-test:checked ~ .toggle-bg { transform: translateX(100%); }

        /* 공통 영역 */
        .main-area {
            flex: 1; position: relative; margin-bottom: 14px;
            min-height: 0; display: flex; flex-direction: column;
        }

        .tag-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }
        .tag {
            display: inline-block; background: var(--primary-light); color: var(--primary-color);
            padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700;
        }

        /* =========================================
           1. 학습 모드 (3D 플래시카드 뒤집기)
           ========================================= */
        .study-wrapper {
            width: 100%; height: 100%;
            perspective: 1000px; cursor: pointer;
        }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-inner.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            background: var(--card-bg); border-radius: var(--border-radius);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 22px; box-sizing: border-box;
            overflow-y: auto; display: flex; flex-direction: column; border: 1px solid #eaeaea;
        }
        .card-back {
            transform: rotateY(180deg); background: #f8fbff; border: 2px solid var(--primary-color);
        }

        .study-question {
            font-size: 1.05rem; line-height: 1.65; font-weight: 600;
            margin-bottom: 20px; color: var(--text-color);
        }
        .study-options { display: flex; flex-direction: column; gap: 12px; }
        .study-option-item {
            background: #f8f9fa; padding: 12px 14px; border-radius: 10px;
            font-size: 0.98rem; line-height: 1.5; border: 1px solid #ececec;
        }

        .answer-text {
            font-size: 1.08rem; line-height: 1.6; font-weight: 700;
            color: var(--primary-color); margin-bottom: 16px;
            padding-bottom: 12px; border-bottom: 1px solid #dcebf7;
        }
        .explanation-text {
            font-size: 0.98rem; line-height: 1.65; color: var(--text-light); white-space: pre-wrap;
        }

        /* =========================================
           2. 테스트 모드 (실전 모의고사 - 정답 숨김 & 별표)
           ========================================= */
        .test-wrapper {
            width: 100%; height: 100%;
            background: var(--card-bg); border-radius: var(--border-radius);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 22px; box-sizing: border-box;
            overflow-y: auto; display: none; flex-direction: column; border: 1px solid #eaeaea;
        }

        .btn-star {
            background: none; border: 1px solid #ddd; border-radius: 20px;
            padding: 4px 12px; font-size: 0.85rem; font-weight: 600;
            color: #888; cursor: pointer; display: flex; align-items: center; gap: 4px;
            transition: all 0.2s;
        }
        .btn-star.active {
            border-color: var(--star-color); background: #fffbeb; color: var(--star-color);
        }

        .test-question {
            font-size: 1.05rem; line-height: 1.65; font-weight: 600; margin-bottom: 22px;
        }
        .test-options {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;
        }
        .option-btn {
            text-align: left; background: #ffffff; border: 2px solid #d0d7de;
            border-radius: 12px; padding: 15px 16px; font-size: 0.98rem; line-height: 1.5;
            color: var(--text-color); cursor: pointer; transition: all 0.15s;
            font-family: inherit; touch-action: manipulation;
        }
        .option-btn:hover {
            border-color: var(--primary-color); background: #f8fbff;
        }
        .option-btn.selected {
            border-color: var(--primary-color); background: var(--primary-light);
            color: var(--primary-dark); font-weight: 700;
        }

        .btn-submit-exam {
            margin-top: auto; width: 100%; padding: 14px;
            background: var(--primary-color); color: white; border: none;
            border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 161, 224, 0.25);
        }
        .btn-submit-exam:hover { background: var(--primary-dark); }

        /* =========================================
           3. 모의고사 채점 결과 및 모아보기 화면
           ========================================= */
        .result-wrapper {
            display: none; flex-direction: column; height: 100%;
        }
        .score-banner {
            background: #f8fbff; border: 2px solid var(--primary-color);
            border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 14px;
        }
        .score-banner h2 { margin: 0 0 6px 0; font-size: 1.2rem; color: var(--primary-color); }
        .score-stats { font-size: 0.9rem; color: var(--text-light); font-weight: 600; }

        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 14px;
        }
        .filter-btn {
            flex: 1; padding: 8px 6px; border: 1px solid #ddd; background: #fff;
            border-radius: 8px; font-size: 0.82rem; font-weight: 700; color: var(--text-light);
            cursor: pointer; text-align: center;
        }
        .filter-btn.active {
            background: var(--primary-color); color: white; border-color: var(--primary-color);
        }

        .review-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
            padding-right: 4px;
        }
        .review-item {
            border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; background: #fff;
        }
        .review-item.is-wrong { border-left: 5px solid var(--error-color); }
        .review-item.is-correct { border-left: 5px solid var(--success-color); }

        .review-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .badge-status {
            font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
        }
        .badge-wrong { background: var(--error-bg); color: var(--error-color); }
        .badge-correct { background: var(--success-bg); color: var(--success-color); }

        .review-q { font-size: 0.95rem; font-weight: 600; line-height: 1.5; margin-bottom: 10px; }
        .review-choice { font-size: 0.88rem; margin-bottom: 6px; padding: 8px 10px; border-radius: 8px; background: #f8f9fa; }
        .review-exp { font-size: 0.88rem; color: var(--text-light); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; }

        .btn-retake {
            margin-top: 12px; width: 100%; padding: 12px; background: #333; color: white;
            border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
        }

        /* 하단 컨트롤 */
        .controls { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 12px 0; }
        .btn {
            background: var(--card-bg); border: 1px solid #ddd; color: var(--text-color);
            padding: 12px 20px; border-radius: 30px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.05); touch-action: manipulation;
        }
        .btn:active { transform: scale(0.96); background: #f0f0f0; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .progress { font-size: 0.95rem; font-weight: 700; color: var(--primary-color); text-align: center; }
        .sub-progress { font-size: 0.78rem; color: var(--text-light); font-weight: 500; display: block; margin-top: 2px; }

        /* 모달 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;
        }
        .modal-content h2 { margin: 0 0 10px 0; font-size: 1.15rem; }
        .modal-content textarea {
            width: 100%; height: 160px; padding: 10px; box-sizing: border-box;
            border: 1px solid #ddd; border-radius: 8px; resize: none; font-size: 0.85rem; margin-bottom: 10px;
        }
        .error-msg { color: #e74c3c; font-size: 0.85rem; margin-bottom: 10px; display: none; font-weight: bold; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #eee; color: #333; }
        .btn-save { background: var(--primary-color); color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-top">
            <h1>MC-Con-201</h1>
            <button class="btn-import" onclick="openModal()">데이터 불러오기</button>
        </div>
        <div class="mode-toggle">
            <input type="radio" name="mode" id="mode-study" value="study" checked onchange="changeMode()">
            <label for="mode-study">학습 모드</label>
            <input type="radio" name="mode" id="mode-test" value="test" onchange="changeMode()">
            <label for="mode-test">테스트 모드</label>
            <div class="toggle-bg"></div>
        </div>
    </header>

    <div class="main-area" id="swipe-area">
        <!-- 1. 학습 모드 (3D 카드 뒤집기) -->
        <div id="study-wrapper" class="study-wrapper" onclick="flipCard()">
            <div class="card-inner" id="card-inner">
                <div class="card-front">
                    <div class="tag-row">
                        <span class="tag" id="study-q-num">대기 중</span>
                    </div>
                    <div class="study-question" id="study-q-text">데이터를 불러오는 중입니다...</div>
                    <div class="study-options" id="study-options-box"></div>
                </div>
                <div class="card-back">
                    <div class="tag-row">
                        <span class="tag">정답 및 해설</span>
                    </div>
                    <div class="answer-text" id="study-answer"></div>
                    <div class="explanation-text" id="study-explanation"></div>
                </div>
            </div>
        </div>

        <!-- 2. 테스트 모드 (실전 모의고사) -->
        <div id="test-wrapper" class="test-wrapper">
            <!-- 문제 풀이 화면 -->
            <div id="test-active-box" style="display:flex; flex-direction:column; height:100%;">
                <div class="tag-row">
                    <span class="tag" id="test-q-num">NO. 1</span>
                    <button class="btn-star" id="btn-star" onclick="toggleStar(event)">
                        <span id="star-icon">☆</span> 별표 표시
                    </button>
                </div>
                <div class="test-question" id="test-q-text"></div>
                <div class="test-options" id="test-options-box"></div>
                <button class="btn-submit-exam" onclick="submitExam()">시험 제출 및 채점하기</button>
            </div>

            <!-- 채점 결과 및 모아보기 화면 -->
            <div id="result-wrapper" class="result-wrapper">
                <div class="score-banner">
                    <h2 id="score-title">채점 결과: 0점</h2>
                    <div class="score-stats" id="score-stats">정답 0 / 전체 106 (별표 0개)</div>
                </div>
                <div class="filter-tabs">
                    <button class="filter-btn active" id="filter-all" onclick="filterResults('all')">전체 보기</button>
                    <button class="filter-btn" id="filter-wrong" onclick="filterResults('wrong')">틀린 문제만</button>
                    <button class="filter-btn" id="filter-star" onclick="filterResults('star')">★ 별표만</button>
                </div>
                <div class="review-list" id="review-list"></div>
                <button class="btn-retake" onclick="resetExam()">모의고사 초기화 및 다시 풀기</button>
            </div>
        </div>
    </div>
    
    <div class="controls" id="bottom-controls">
        <button class="btn" id="btn-prev" onclick="prevCard()">◀ 이전</button>
        <div class="progress">
            <span id="progress-text">0 / 0</span>
            <span class="sub-progress" id="sub-progress-text"></span>
        </div>
        <button class="btn" id="btn-next" onclick="nextCard()">다음 ▶</button>
    </div>

    <!-- 데이터 Import 모달 -->
    <div class="modal-overlay" id="import-modal">
        <div class="modal-content">
            <h2>데이터 불러오기</h2>
            <p style="font-size:0.8rem; color:#666; margin-top:0;">data.json 내용을 붙여넣으세요.</p>
            <textarea id="json-input" placeholder="여기에 데이터를 붙여넣으세요."></textarea>
            <div class="error-msg" id="error-msg">데이터 형식을 인식할 수 없습니다.</div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-save" onclick="saveData()">적용하기</button>
            </div>
        </div>
    </div>
</div>

<script>
    let allCards = [];
    let currentMode = 'study'; // 'study' or 'test'

    // 학습 모드 상태
    let studyIndex = 0;
    let isFlipped = false;

    // 테스트 모드 상태
    let testIndex = 0;
    let userAnswers = {}; // { qNum: 'A' }
    let starredSet = new Set(); // 별표 표시된 qNum 집합
    let isExamSubmitted = false;
    let currentFilter = 'all';

    // DOM 요소
    const studyWrapper = document.getElementById('study-wrapper');
    const testWrapper = document.getElementById('test-wrapper');
    const cardInner = document.getElementById('card-inner');
    const bottomControls = document.getElementById('bottom-controls');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const progressText = document.getElementById('progress-text');
    const subProgressText = document.getElementById('sub-progress-text');

    function splitQuestionAndOptions(frontText) {
        const lines = frontText.split('\n');
        let questionLines = [];
        let options = [];

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            const optMatch = trimmed.match(/^([A-E])\.\s*(.+)/);
            if (optMatch) {
                options.push({ letter: optMatch[1].toUpperCase(), text: optMatch[2], full: trimmed });
            } else {
                questionLines.push(trimmed);
            }
        });

        return {
            question: questionLines.join(' '),
            options: options
        };
    }

    function extractAnswerLetter(answerText) {
        const match = answerText.match(/(?:정답:\s*)?([A-E])\b/i);
        return match ? match[1].toUpperCase() : '';
    }

    async function loadData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('Network error');
            allCards = await response.json();
            initApp();
        } catch (error) {
            document.getElementById('study-q-text').textContent = "상단의 '데이터 불러오기'를 눌러 데이터를 입력하거나, 같은 폴더에 data.json 파일을 위치시켜주세요.";
        }
    }

    function initApp() {
        if (allCards.length === 0) return;
        studyIndex = 0;
        resetExam(false);
        renderCurrentView();
    }

    function changeMode() {
        currentMode = document.getElementById('mode-study').checked ? 'study' : 'test';
        if (currentMode === 'study') {
            studyWrapper.style.display = 'block';
            testWrapper.style.display = 'none';
            bottomControls.style.display = 'flex';
            isFlipped = false;
            cardInner.classList.remove('flipped');
        } else {
            studyWrapper.style.display = 'none';
            testWrapper.style.display = 'flex';
            bottomControls.style.display = isExamSubmitted ? 'none' : 'flex';
        }
        renderCurrentView();
    }

    function renderCurrentView() {
        if (allCards.length === 0) return;
        if (currentMode === 'study') {
            renderStudyCard();
        } else {
            if (isExamSubmitted) {
                renderResultScreen();
            } else {
                renderTestCard();
            }
        }
    }

    /* =========================================
       1. 학습 모드 (3D 뒤집기)
       ========================================= */
    function renderStudyCard() {
        const card = allCards[studyIndex];
        const parsed = splitQuestionAndOptions(card.front);

        document.getElementById('study-q-num').textContent = `NO. ${card.qNum || (studyIndex + 1)}`;
        document.getElementById('study-q-text').textContent = parsed.question;

        const optionsBox = document.getElementById('study-options-box');
        optionsBox.innerHTML = '';
        parsed.options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'study-option-item';
            div.textContent = opt.full;
            optionsBox.appendChild(div);
        });

        document.getElementById('study-answer').textContent = card.answer;
        document.getElementById('study-explanation').textContent = card.explanation;

        progressText.textContent = `${studyIndex + 1} / ${allCards.length}`;
        subProgressText.textContent = '';

        btnPrev.disabled = studyIndex === 0;
        btnNext.disabled = studyIndex === allCards.length - 1;

        isFlipped = false;
        cardInner.classList.remove('flipped');
        document.querySelector('.card-front').scrollTop = 0;
        document.querySelector('.card-back').scrollTop = 0;
    }

    function flipCard() {
        if (currentMode !== 'study' || allCards.length === 0) return;
        isFlipped = !isFlipped;
        if (isFlipped) cardInner.classList.add('flipped');
        else cardInner.classList.remove('flipped');
    }

    /* =========================================
       2. 테스트 모드 (실전 모의고사 & 별표 북마크)
       ========================================= */
    function resetExam(shouldRender = true) {
        testIndex = 0;
        userAnswers = {};
        starredSet.clear();
        isExamSubmitted = false;
        currentFilter = 'all';
        document.getElementById('test-active-box').style.display = 'flex';
        document.getElementById('result-wrapper').style.display = 'none';
        if (currentMode === 'test') bottomControls.style.display = 'flex';
        if (shouldRender && currentMode === 'test') renderTestCard();
    }

    function renderTestCard() {
        document.getElementById('test-active-box').style.display = 'flex';
        document.getElementById('result-wrapper').style.display = 'none';
        bottomControls.style.display = 'flex';

        const card = allCards[testIndex];
        const qNum = card.qNum || (testIndex + 1);
        const parsed = splitQuestionAndOptions(card.front);
        const selectedLetter = userAnswers[qNum];

        document.getElementById('test-q-num').textContent = `NO. ${qNum}`;
        updateStarButtonUI(qNum);

        document.getElementById('test-q-text').textContent = parsed.question;

        const optionsBox = document.getElementById('test-options-box');
        optionsBox.innerHTML = '';

        parsed.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.full;

            if (selectedLetter === opt.letter) {
                btn.classList.add('selected');
            }

            btn.onclick = (e) => {
                e.stopPropagation();
                selectTestOption(qNum, opt.letter);
            };
            optionsBox.appendChild(btn);
        });

        const answeredCount = Object.keys(userAnswers).length;
        progressText.textContent = `${testIndex + 1} / ${allCards.length}`;
        subProgressText.textContent = `풀이 완료: ${answeredCount}문항 | ★ 별표: ${starredSet.size}개`;

        btnPrev.disabled = testIndex === 0;
        btnNext.disabled = testIndex === allCards.length - 1;
        testWrapper.scrollTop = 0;
    }

    function selectTestOption(qNum, letter) {
        // 정답을 보여주지 않고 선택 상태만 저장
        userAnswers[qNum] = letter;
        renderTestCard();
    }

    function toggleStar(e) {
        e.stopPropagation();
        const card = allCards[testIndex];
        const qNum = card.qNum || (testIndex + 1);
        if (starredSet.has(qNum)) {
            starredSet.delete(qNum);
        } else {
            starredSet.add(qNum);
        }
        renderTestCard();
    }

    function updateStarButtonUI(qNum) {
        const btnStar = document.getElementById('btn-star');
        const starIcon = document.getElementById('star-icon');
        if (starredSet.has(qNum)) {
            btnStar.classList.add('active');
            starIcon.textContent = '★';
        } else {
            btnStar.classList.remove('active');
            starIcon.textContent = '☆';
        }
    }

    function submitExam() {
        isExamSubmitted = true;
        renderResultScreen();
    }

    function renderResultScreen() {
        document.getElementById('test-active-box').style.display = 'none';
        document.getElementById('result-wrapper').style.display = 'flex';
        bottomControls.style.display = 'none';

        let correctCount = 0;
        allCards.forEach((card, idx) => {
            const qNum = card.qNum || (idx + 1);
            const correctLetter = extractAnswerLetter(card.answer);
            if (userAnswers[qNum] === correctLetter) {
                correctCount++;
            }
        });

        const score = Math.round((correctCount / allCards.length) * 100);
        document.getElementById('score-title').textContent = `모의고사 결과: ${score}점`;
        document.getElementById('score-stats').textContent = `정답 ${correctCount} / ${allCards.length}문항 | ★ 별표 ${starredSet.size}개`;

        filterResults(currentFilter);
    }

    function filterResults(filterType) {
        currentFilter = filterType;
        document.getElementById('filter-all').classList.toggle('active', filterType === 'all');
        document.getElementById('filter-wrong').classList.toggle('active', filterType === 'wrong');
        document.getElementById('filter-star').classList.toggle('active', filterType === 'star');

        const listBox = document.getElementById('review-list');
        listBox.innerHTML = '';

        allCards.forEach((card, idx) => {
            const qNum = card.qNum || (idx + 1);
            const correctLetter = extractAnswerLetter(card.answer);
            const userChoice = userAnswers[qNum] || '미선택';
            const isCorrect = (userChoice === correctLetter);
            const isStarred = starredSet.has(qNum);

            if (filterType === 'wrong' && isCorrect) return;
            if (filterType === 'star' && !isStarred) return;

            const parsed = splitQuestionAndOptions(card.front);
            const itemDiv = document.createElement('div');
            itemDiv.className = `review-item ${isCorrect ? 'is-correct' : 'is-wrong'}`;

            itemDiv.innerHTML = `
                <div class="review-header">
                    <span style="font-weight:700; color:var(--primary-color);">NO. ${qNum} ${isStarred ? '★' : ''}</span>
                    <span class="badge-status ${isCorrect ? 'badge-correct' : 'badge-wrong'}">
                        ${isCorrect ? '정답' : '오답'}
                    </span>
                </div>
                <div class="review-q">${parsed.question}</div>
                <div class="review-choice">
                    <div>내 선택: <strong>${userChoice}</strong></div>
                    <div style="color:var(--primary-color); margin-top:4px;"><strong>${card.answer}</strong></div>
                </div>
                <div class="review-exp">${card.explanation}</div>
            `;
            listBox.appendChild(itemDiv);
        });

        if (listBox.innerHTML === '') {
            listBox.innerHTML = `<div style="text-align:center; padding:40px 0; color:#888;">해당 조건에 맞는 문제가 없습니다.</div>`;
        }
    }

    /* =========================================
       네비게이션 (이전 / 다음 / 스와이프 / 키보드)
       ========================================= */
    function nextCard() {
        if (currentMode === 'study') {
            if (studyIndex < allCards.length - 1) {
                studyIndex++;
                renderStudyCard();
            }
        } else if (!isExamSubmitted) {
            if (testIndex < allCards.length - 1) {
                testIndex++;
                renderTestCard();
            }
        }
    }

    function prevCard() {
        if (currentMode === 'study') {
            if (studyIndex > 0) {
                studyIndex--;
                renderStudyCard();
            }
        } else if (!isExamSubmitted) {
            if (testIndex > 0) {
                testIndex--;
                renderTestCard();
            }
        }
    }

    const swipeArea = document.getElementById('swipe-area');
    let touchstartX = 0; let touchendX = 0;
    swipeArea.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
    swipeArea.addEventListener('touchend', e => {
        if (currentMode === 'test' && isExamSubmitted) return;
        touchendX = e.changedTouches[0].screenX;
        const threshold = 75;
        if (touchendX < touchstartX - threshold) nextCard();
        if (touchendX > touchstartX + threshold) prevCard();
    }, {passive: true});

    document.addEventListener('keydown', (e) => {
        if (document.getElementById('import-modal').style.display === 'flex') return;
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === ' ' && currentMode === 'study') {
            e.preventDefault();
            flipCard();
        }
    });

    function openModal() {
        document.getElementById('import-modal').style.display = 'flex';
        document.getElementById('error-msg').style.display = 'none';
        document.getElementById('json-input').value = '';
    }
    function closeModal() {
        document.getElementById('import-modal').style.display = 'none';
    }
    function saveData() {
        const input = document.getElementById('json-input').value.trim();
        if (!input) return;
        try {
            const parsed = JSON.parse(input);
            if (Array.isArray(parsed) && parsed.length > 0) {
                allCards = parsed;
                initApp();
                closeModal();
                return;
            }
        } catch (e) {}
        document.getElementById('error-msg').style.display = 'block';
    }

    window.onload = loadData;
</script>

</body>
</html>
