<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC-Con-201 학습 및 실전 모의고사</title>
    <style>
        :root {
            --primary-color: #00A1E0;
            --primary-light: #e3f2fd;
            --primary-dark: #0077a8;
            --success-color: #2e7d32;
            --success-bg: #e8f5e9;
            --error-color: #c62828;
            --error-bg: #ffebee;
            --star-color: #f59e0b;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #222222;
            --text-light: #555555;
            --border-radius: 16px;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; height: 100dvh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 680px;
            padding: 14px 18px; box-sizing: border-box;
            display: flex; flex-direction: column;
            height: 100%;
        }

        header { margin-bottom: 12px; flex-shrink: 0; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
        h1 { font-size: 1.2rem; margin: 0; color: var(--primary-color); }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-import {
            background: var(--card-bg); border: 1px solid #ddd;
            color: var(--text-light); padding: 6px 12px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-import:hover { color: var(--primary-color); border-color: var(--primary-color); }

        .btn-submit-top {
            background: var(--primary-color); border: none;
            color: white; padding: 6px 14px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0, 161, 224, 0.25);
            display: none;
        }
        .btn-submit-top:hover { background: var(--primary-dark); }

        /* 모드 전환 토글 */
        .mode-toggle {
            display: flex; background: #e0e0e0; border-radius: 30px;
            position: relative; margin-bottom: 10px;
        }
        .mode-toggle input[type="radio"] { display: none; }
        .mode-toggle label {
            flex: 1; text-align: center; padding: 9px; font-size: 0.9rem;
            font-weight: 700; cursor: pointer; z-index: 1; transition: color 0.3s; color: var(--text-light);
        }
        .mode-toggle input[type="radio"]:checked + label { color: white; }
        .toggle-bg {
            position: absolute; top: 0; left: 0; height: 100%; width: 50%;
            background-color: var(--primary-color); border-radius: 30px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 0;
        }
        #mode-study:checked ~ .toggle-bg { transform: translateX(0); }
        #mode-test:checked ~ .toggle-bg { transform: translateX(100%); }

        /* 서브 옵션 바 */
        .sub-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            background: #ffffff; padding: 8px 14px; border-radius: 12px;
            border: 1px solid #e5e7eb; font-size: 0.85rem;
        }
        .btn-filter-star {
            background: #f8f9fa; border: 1px solid #ddd; border-radius: 16px;
            padding: 4px 12px; font-size: 0.82rem; font-weight: 700;
            color: var(--text-light); cursor: pointer; transition: all 0.2s;
        }
        .btn-filter-star.active {
            background: #fffbeb; border-color: var(--star-color); color: #b45309;
        }

        /* 스위치 디자인 (오답 반복 ON/OFF) */
        .switch-label {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            font-weight: 600; color: var(--text-color); user-select: none;
        }
        .switch-input { display: none; }
        .switch-slider {
            width: 36px; height: 20px; background: #ccc; border-radius: 20px;
            position: relative; transition: background 0.25s;
        }
        .switch-slider::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px; background: white; border-radius: 50%;
            transition: transform 0.25s;
        }
        .switch-input:checked + .switch-slider { background: var(--primary-color); }
        .switch-input:checked + .switch-slider::after { transform: translateX(16px); }

        /* 공통 영역 */
        .main-area {
            flex: 1; position: relative;
            min-height: 0; display: flex; flex-direction: column;
        }

        .tag-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; flex-shrink: 0;
        }
        .tag-group { display: flex; align-items: center; gap: 6px; }
        .tag {
            display: inline-block; background: var(--primary-light); color: var(--primary-color);
            padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700;
        }
        .retry-badge {
            background: var(--error-bg); color: var(--error-color);
            padding: 4px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 700;
        }

        .btn-star {
            background: none; border: 1px solid #ddd; border-radius: 20px;
            padding: 4px 12px; font-size: 0.82rem; font-weight: 600;
            color: #888; cursor: pointer; display: flex; align-items: center; gap: 4px;
            transition: all 0.2s; z-index: 5;
        }
        .btn-star.active {
            border-color: var(--star-color); background: #fffbeb; color: #b45309;
        }

        /* =========================================
           1. 학습 모드 (3D 플래시카드 뒤집기 & 내부 스크롤)
           ========================================= */
        .study-wrapper {
            width: 100%; flex: 1; min-height: 0;
            perspective: 1000px; cursor: pointer;
            margin-bottom: 12px;
        }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-inner.flipped { transform: rotateY(180deg); }

        /* 앞/뒷면 전환 시 비활성 면의 pointer-events와 visibility를 제어하여 모바일/PC 내부 스크롤 보장 */
        .card-front, .card-back {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            background: var(--card-bg); border-radius: var(--border-radius);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 20px; box-sizing: border-box;
            overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
            display: flex; flex-direction: column; border: 1px solid #eaeaea;
            pointer-events: auto;
        }
        .card-back {
            transform: rotateY(180deg); background: #f8fbff; border: 2px solid var(--primary-color);
            pointer-events: none;
        }
        .card-inner.flipped .card-front {
            pointer-events: none;
        }
        .card-inner.flipped .card-back {
            pointer-events: auto;
        }

        .study-question {
            font-size: 1.05rem; line-height: 1.65; font-weight: 600;
            margin-bottom: 20px; color: var(--text-color);
        }
        .study-options { display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
        .study-option-item {
            background: #f8f9fa; padding: 12px 14px; border-radius: 10px;
            font-size: 0.96rem; line-height: 1.5; border: 1px solid #ececec;
        }

        .answer-text {
            font-size: 1.06rem; line-height: 1.6; font-weight: 700;
            color: var(--primary-color); margin-bottom: 16px;
            padding-bottom: 12px; border-bottom: 1px solid #dcebf7;
        }
        .explanation-text {
            font-size: 0.96rem; line-height: 1.65; color: var(--text-light); white-space: pre-wrap;
            padding-bottom: 12px;
        }

        /* =========================================
           2. 테스트 모드 (카드 박스 최하단 이전/다음 배치)
           ========================================= */
        .test-wrapper {
            width: 100%; height: 100%;
            background: var(--card-bg); border-radius: var(--border-radius);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 20px; box-sizing: border-box;
            display: none; flex-direction: column; border: 1px solid #eaeaea;
            overflow: hidden;
        }

        .test-scroll-content {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        .test-question {
            font-size: 1.05rem; line-height: 1.65; font-weight: 600; margin-bottom: 20px;
        }
        .test-options {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px;
        }
        .option-btn {
            text-align: left; background: #ffffff; border: 2px solid #d0d7de;
            border-radius: 12px; padding: 14px 16px; font-size: 0.96rem; line-height: 1.5;
            color: var(--text-color); cursor: pointer; transition: all 0.15s;
            font-family: inherit; touch-action: manipulation;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color); background: #f8fbff;
        }
        .option-btn.selected {
            border-color: var(--primary-color); background: var(--primary-light);
            color: var(--primary-dark); font-weight: 700;
        }
        .option-btn.correct {
            border-color: var(--success-color); background: var(--success-bg);
            color: var(--success-color); font-weight: 700;
        }
        .option-btn.wrong {
            border-color: var(--error-color); background: var(--error-bg);
            color: var(--error-color); font-weight: 600;
        }
        .option-btn:disabled { cursor: default; }

        .instant-feedback {
            display: none; padding: 14px 16px; border-radius: 12px;
            font-size: 0.94rem; line-height: 1.6; margin-bottom: 16px;
        }
        .instant-feedback.show-correct {
            display: block; background: var(--success-bg); color: #1b5e20; border: 1px solid #c8e6c9;
        }
        .instant-feedback.show-wrong {
            display: block; background: var(--error-bg); color: #b71c1c; border: 1px solid #ffcdd2;
        }

        /* 카드 박스 최하단 네비게이션 바 */
        .card-bottom-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 14px; margin-top: 8px;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        /* 완료/결과 화면 */
        .result-wrapper, .complete-box {
            display: none; flex-direction: column; height: 100%;
        }
        .complete-box {
            align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        .score-banner {
            background: #f8fbff; border: 2px solid var(--primary-color);
            border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 12px;
        }
        .score-banner h2 { margin: 0 0 6px 0; font-size: 1.15rem; color: var(--primary-color); }
        .score-stats { font-size: 0.88rem; color: var(--text-light); font-weight: 600; }

        .filter-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .filter-btn {
            flex: 1; padding: 8px 6px; border: 1px solid #ddd; background: #fff;
            border-radius: 8px; font-size: 0.82rem; font-weight: 700; color: var(--text-light);
            cursor: pointer; text-align: center;
        }
        .filter-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .review-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
        .review-item { border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px; background: #fff; }
        .review-item.is-wrong { border-left: 5px solid var(--error-color); }
        .review-item.is-correct { border-left: 5px solid var(--success-color); }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .badge-status { font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
        .badge-wrong { background: var(--error-bg); color: var(--error-color); }
        .badge-correct { background: var(--success-bg); color: var(--success-color); }
        .review-q { font-size: 0.94rem; font-weight: 600; line-height: 1.5; margin-bottom: 8px; }
        .review-choice { font-size: 0.86rem; margin-bottom: 6px; padding: 8px 10px; border-radius: 8px; background: #f8f9fa; }
        .review-exp { font-size: 0.86rem; color: var(--text-light); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; }

        .btn-retake {
            margin-top: 12px; width: 100%; padding: 12px; background: #333; color: white;
            border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
        }

        /* 공통 버튼/진행률 스타일 */
        .study-controls {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 0 6px 0; flex-shrink: 0;
        }
        .btn {
            background: var(--card-bg); border: 1px solid #ddd; color: var(--text-color);
            padding: 10px 18px; border-radius: 30px; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.05); touch-action: manipulation;
        }
        .btn-nav-primary {
            background: var(--primary-light); border-color: #bce0fd; color: var(--primary-dark);
        }
        .btn:active { transform: scale(0.96); background: #f0f0f0; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .progress { font-size: 0.95rem; font-weight: 700; color: var(--primary-color); text-align: center; }
        .sub-progress { font-size: 0.75rem; color: var(--text-light); font-weight: 500; display: block; margin-top: 2px; }

        /* 모달 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column;
        }
        .modal-content h2 { margin: 0 0 10px 0; font-size: 1.15rem; }
        .modal-content textarea {
            width: 100%; height: 160px; padding: 10px; box-sizing: border-box;
            border: 1px solid #ddd; border-radius: 8px; resize: none; font-size: 0.85rem; margin-bottom: 10px;
        }
        .error-msg { color: #e74c3c; font-size: 0.85rem; margin-bottom: 10px; display: none; font-weight: bold; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-actions button { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #eee; color: #333; }
        .btn-save { background: var(--primary-color); color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-top">
            <h1>MC-Con-201</h1>
            <div class="header-actions">
                <button class="btn-submit-top" id="btn-submit-top" onclick="submitExam()">시험 제출 및 채점하기</button>
                <button class="btn-import" onclick="openModal()">데이터 불러오기</button>
            </div>
        </div>
        <div class="mode-toggle">
            <input type="radio" name="mode" id="mode-study" value="study" checked onchange="changeMode()">
            <label for="mode-study">학습 모드</label>
            <input type="radio" name="mode" id="mode-test" value="test" onchange="changeMode()">
            <label for="mode-test">테스트 모드</label>
            <div class="toggle-bg"></div>
        </div>

        <!-- 모드별 서브 옵션 툴바 -->
        <div class="sub-toolbar" id="study-toolbar">
            <span style="color:#666; font-weight:600;">학습 필터</span>
            <button class="btn-filter-star" id="btn-study-star-filter" onclick="toggleStudyStarFilter()">
                ☆ 별표만 모아보기 (<span id="star-count-badge">0</span>)
            </button>
        </div>

        <div class="sub-toolbar" id="test-toolbar" style="display:none;">
            <label class="switch-label">
                <input type="checkbox" class="switch-input" id="repeat-until-correct-toggle" onchange="toggleRepeatMode()">
                <span class="switch-slider"></span>
                <span>오답 맞힐 때까지 반복</span>
            </label>
            <span style="font-size:0.78rem; color:#888;" id="repeat-mode-desc">모의고사 모드</span>
        </div>
    </header>

    <div class="main-area" id="swipe-area">
        <!-- 1. 학습 모드 (3D 카드 뒤집기 + 내부 스크롤) -->
        <div id="study-wrapper" class="study-wrapper" onclick="flipCard()">
            <div class="card-inner" id="card-inner">
                <div class="card-front" id="study-card-front">
                    <div class="tag-row">
                        <span class="tag" id="study-q-num">대기 중</span>
                        <button class="btn-star" id="btn-study-star" onclick="toggleStar(event)">
                            <span class="star-icon">☆</span> 별표
                        </button>
                    </div>
                    <div class="study-question" id="study-q-text">데이터를 불러오는 중입니다...</div>
                    <div class="study-options" id="study-options-box"></div>
                </div>
                <div class="card-back" id="study-card-back">
                    <div class="tag-row">
                        <span class="tag">정답 및 해설</span>
                        <button class="btn-star" id="btn-study-star-back" onclick="toggleStar(event)">
                            <span class="star-icon">☆</span> 별표
                        </button>
                    </div>
                    <div class="answer-text" id="study-answer"></div>
                    <div class="explanation-text" id="study-explanation"></div>
                </div>
            </div>
        </div>

        <!-- 학습 모드 하단 네비게이션 -->
        <div class="study-controls" id="study-controls">
            <button class="btn" id="btn-study-prev" onclick="prevCard()">◀ 이전</button>
            <div class="progress">
                <span id="study-progress-text">0 / 0</span>
                <span class="sub-progress" id="study-sub-progress"></span>
            </div>
            <button class="btn" id="btn-study-next" onclick="nextCard()">다음 ▶</button>
        </div>

        <!-- 2. 테스트 모드 (카드 박스 최하단에 이전/다음 버튼 배치) -->
        <div id="test-wrapper" class="test-wrapper">
            <div id="test-active-box" style="display:flex; flex-direction:column; height:100%;">
                <div class="tag-row">
                    <div class="tag-group">
                        <span class="tag" id="test-q-num">NO. 1</span>
                        <span class="retry-badge" id="test-retry-badge" style="display:none;">오답 재도전</span>
                    </div>
                    <button class="btn-star" id="btn-test-star" onclick="toggleStar(event)">
                        <span class="star-icon">☆</span> 별표
                    </button>
                </div>

                <div class="test-scroll-content" id="test-scroll-content">
                    <div class="test-question" id="test-q-text"></div>
                    <div class="test-options" id="test-options-box"></div>
                    <div class="instant-feedback" id="instant-feedback"></div>
                </div>

                <!-- 카드 박스 최하단 이전/다음 버튼 -->
                <div class="card-bottom-nav">
                    <button class="btn" id="btn-test-prev" onclick="prevCard()">◀ 이전</button>
                    <div class="progress">
                        <span id="test-progress-text">0 / 0</span>
                        <span class="sub-progress" id="test-sub-progress"></span>
                    </div>
                    <button class="btn btn-nav-primary" id="btn-test-next" onclick="nextCard()">다음 ▶</button>
                </div>
            </div>

            <!-- 일반 모의고사 채점 결과 화면 -->
            <div id="result-wrapper" class="result-wrapper">
                <div class="score-banner">
                    <h2 id="score-title">채점 결과: 0점</h2>
                    <div class="score-stats" id="score-stats">정답 0 / 전체 106</div>
                </div>
                <div class="filter-tabs">
                    <button class="filter-btn active" id="filter-all" onclick="filterResults('all')">전체 보기</button>
                    <button class="filter-btn" id="filter-wrong" onclick="filterResults('wrong')">틀린 문제만</button>
                    <button class="filter-btn" id="filter-star" onclick="filterResults('star')">★ 별표만</button>
                </div>
                <div class="review-list" id="review-list"></div>
                <button class="btn-retake" onclick="resetExam()">모의고사 초기화 및 다시 풀기</button>
            </div>

            <!-- 오답 반복 모드 전체 마스터 완료 화면 -->
            <div class="complete-box" id="repeat-complete-box">
                <h2 style="color:var(--primary-color); margin-bottom:10px;">모든 문제를 맞혔습니다!</h2>
                <p style="color:#666; line-height:1.6;">오답 반복 학습을 통해 전체 문항을 마스터했습니다.</p>
                <button class="btn-retake" style="max-width:260px;" onclick="resetRepeatMode()">처음부터 다시 도전하기</button>
            </div>
        </div>
    </div>

    <!-- 데이터 Import 모달 -->
    <div class="modal-overlay" id="import-modal">
        <div class="modal-content">
            <h2>데이터 불러오기</h2>
            <p style="font-size:0.8rem; color:#666; margin-top:0;">data.json 내용을 붙여넣으세요.</p>
            <textarea id="json-input" placeholder="여기에 데이터를 붙여넣으세요."></textarea>
            <div class="error-msg" id="error-msg">데이터 형식을 인식할 수 없습니다.</div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-save" onclick="saveData()">적용하기</button>
            </div>
        </div>
    </div>
</div>

<script>
    let allCards = [];
    let currentMode = 'study'; // 'study' or 'test'
    let starredSet = new Set();

    // 1. 학습 모드 상태
    let studyList = [];
    let studyIndex = 0;
    let isFlipped = false;
    let isStudyStarFilter = false;

    // 2. 테스트 모드 상태
    let isRepeatUntilCorrect = false;
    
    // 2-A. 일반 모의고사 상태
    let examIndex = 0;
    let examAnswers = {};
    let isExamSubmitted = false;
    let currentResultFilter = 'all';

    // 2-B. 오답 반복 모드 상태
    let repeatQueue = [];
    let repeatIndex = 0;
    let masteredCount = 0;

    // DOM 요소
    const studyWrapper = document.getElementById('study-wrapper');
    const studyControls = document.getElementById('study-controls');
    const testWrapper = document.getElementById('test-wrapper');
    const studyToolbar = document.getElementById('study-toolbar');
    const testToolbar = document.getElementById('test-toolbar');
    const cardInner = document.getElementById('card-inner');
    const btnSubmitTop = document.getElementById('btn-submit-top');

    function splitQuestionAndOptions(frontText) {
        const lines = frontText.split('\n');
        let questionLines = [];
        let options = [];

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;
            const optMatch = trimmed.match(/^([A-E])\.\s*(.+)/);
            if (optMatch) {
                options.push({ letter: optMatch[1].toUpperCase(), text: optMatch[2], full: trimmed });
            } else {
                questionLines.push(trimmed);
            }
        });

        return { question: questionLines.join(' '), options: options };
    }

    function extractAnswerLetter(answerText) {
        const match = answerText.match(/(?:정답:\s*)?([A-E])\b/i);
        return match ? match[1].toUpperCase() : '';
    }

    async function loadData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('Network error');
            allCards = await response.json();
            initApp();
        } catch (error) {
            document.getElementById('study-q-text').textContent = "상단의 '데이터 불러오기'를 눌러 데이터를 입력하거나, 같은 폴더에 data.json 파일을 위치시켜주세요.";
        }
    }

    function initApp() {
        if (allCards.length === 0) return;
        starredSet.clear();
        isStudyStarFilter = false;
        studyList = [...allCards];
        studyIndex = 0;
        resetExam(false);
        resetRepeatMode(false);
        updateStarBadgeCount();
        renderCurrentView();
    }

    function updateTopSubmitButton() {
        if (currentMode === 'test' && !isRepeatUntilCorrect && !isExamSubmitted && allCards.length > 0) {
            btnSubmitTop.style.display = 'inline-block';
        } else {
            btnSubmitTop.style.display = 'none';
        }
    }

    function changeMode() {
        currentMode = document.getElementById('mode-study').checked ? 'study' : 'test';
        if (currentMode === 'study') {
            studyWrapper.style.display = 'block';
            studyControls.style.display = 'flex';
            testWrapper.style.display = 'none';
            studyToolbar.style.display = 'flex';
            testToolbar.style.display = 'none';
            isFlipped = false;
            cardInner.classList.remove('flipped');
        } else {
            studyWrapper.style.display = 'none';
            studyControls.style.display = 'none';
            testWrapper.style.display = 'flex';
            studyToolbar.style.display = 'none';
            testToolbar.style.display = 'flex';
        }
        updateTopSubmitButton();
        renderCurrentView();
    }

    function renderCurrentView() {
        if (allCards.length === 0) return;
        updateTopSubmitButton();
        if (currentMode === 'study') {
            renderStudyCard();
        } else {
            if (isRepeatUntilCorrect) {
                renderRepeatCard();
            } else {
                if (isExamSubmitted) renderResultScreen();
                else renderExamCard();
            }
        }
    }

    /* =========================================
       별표(북마크) 공통 관리 로직
       ========================================= */
    function getCurrentQNum() {
        if (currentMode === 'study') {
            if (studyList.length === 0) return null;
            return studyList[studyIndex].qNum || (studyIndex + 1);
        } else {
            if (isRepeatUntilCorrect) {
                return repeatQueue[repeatIndex]?.qNum;
            } else {
                return allCards[examIndex]?.qNum || (examIndex + 1);
            }
        }
    }

    function toggleStar(e) {
        e.stopPropagation();
        const qNum = getCurrentQNum();
        if (!qNum) return;

        if (starredSet.has(qNum)) {
            starredSet.delete(qNum);
        } else {
            starredSet.add(qNum);
        }
        updateStarBadgeCount();

        if (currentMode === 'study' && isStudyStarFilter) {
            applyStudyFilter();
        } else {
            syncStarButtonsUI(qNum);
            if (currentMode === 'test' && !isRepeatUntilCorrect && !isExamSubmitted) {
                const answeredCount = Object.keys(examAnswers).length;
                document.getElementById('test-sub-progress').textContent = `풀이 완료: ${answeredCount}문항 | ★ 별표: ${starredSet.size}개`;
            }
        }
    }

    function updateStarBadgeCount() {
        const badge = document.getElementById('star-count-badge');
        if (badge) badge.textContent = starredSet.size;
    }

    function syncStarButtonsUI(qNum) {
        const isStarred = starredSet.has(qNum);
        const btns = [
            document.getElementById('btn-study-star'),
            document.getElementById('btn-study-star-back'),
            document.getElementById('btn-test-star')
        ];
        btns.forEach(btn => {
            if (!btn) return;
            const icon = btn.querySelector('.star-icon');
            if (isStarred) {
                btn.classList.add('active');
                icon.textContent = '★';
            } else {
                btn.classList.remove('active');
                icon.textContent = '☆';
            }
        });
    }

    /* =========================================
       1. 학습 모드 (3D 뒤집기 + 내부 스크롤)
       ========================================= */
    function toggleStudyStarFilter() {
        isStudyStarFilter = !isStudyStarFilter;
        const btn = document.getElementById('btn-study-star-filter');
        if (isStudyStarFilter) {
            btn.classList.add('active');
            btn.innerHTML = `★ 별표만 보는 중 (<span id="star-count-badge">${starredSet.size}</span>)`;
        } else {
            btn.classList.remove('active');
            btn.innerHTML = `☆ 별표만 모아보기 (<span id="star-count-badge">${starredSet.size}</span>)`;
        }
        applyStudyFilter();
    }

    function applyStudyFilter() {
        if (isStudyStarFilter) {
            studyList = allCards.filter((c, idx) => starredSet.has(c.qNum || (idx + 1)));
        } else {
            studyList = [...allCards];
        }
        studyIndex = 0;
        renderStudyCard();
    }

    function renderStudyCard() {
        const optionsBox = document.getElementById('study-options-box');
        const prevBtn = document.getElementById('btn-study-prev');
        const nextBtn = document.getElementById('btn-study-next');
        const progText = document.getElementById('study-progress-text');
        const subProg = document.getElementById('study-sub-progress');

        if (studyList.length === 0) {
            document.getElementById('study-q-num').textContent = "알림";
            document.getElementById('study-q-text').textContent = "별표 표시한 문제가 없습니다. 전체 보기 상태에서 중요한 문제에 별표를 눌러보세요.";
            optionsBox.innerHTML = '';
            document.getElementById('study-answer').textContent = "";
            document.getElementById('study-explanation').textContent = "";
            progText.textContent = `0 / 0`;
            subProg.textContent = '';
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            isFlipped = false;
            cardInner.classList.remove('flipped');
            return;
        }

        const card = studyList[studyIndex];
        const qNum = card.qNum || (studyIndex + 1);
        const parsed = splitQuestionAndOptions(card.front);

        document.getElementById('study-q-num').textContent = `NO. ${qNum}`;
        syncStarButtonsUI(qNum);

        document.getElementById('study-q-text').textContent = parsed.question;
        optionsBox.innerHTML = '';
        parsed.options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'study-option-item';
            div.textContent = opt.full;
            optionsBox.appendChild(div);
        });

        document.getElementById('study-answer').textContent = card.answer;
        document.getElementById('study-explanation').textContent = card.explanation;

        progText.textContent = `${studyIndex + 1} / ${studyList.length}`;
        subProg.textContent = isStudyStarFilter ? '★ 별표 집중 학습 중' : '';

        prevBtn.disabled = studyIndex === 0;
        nextBtn.disabled = studyIndex === studyList.length - 1;

        isFlipped = false;
        cardInner.classList.remove('flipped');
        document.getElementById('study-card-front').scrollTop = 0;
        document.getElementById('study-card-back').scrollTop = 0;
    }

    function flipCard() {
        if (currentMode !== 'study' || studyList.length === 0) return;
        isFlipped = !isFlipped;
        if (isFlipped) cardInner.classList.add('flipped');
        else cardInner.classList.remove('flipped');
    }

    /* =========================================
       2. 테스트 모드 전환 (일반 모의고사 vs 오답 무한반복)
       ========================================= */
    function toggleRepeatMode() {
        isRepeatUntilCorrect = document.getElementById('repeat-until-correct-toggle').checked;
        const desc = document.getElementById('repeat-mode-desc');
        desc.textContent = isRepeatUntilCorrect ? '오답 반복 ON' : '모의고사 모드';
        desc.style.color = isRepeatUntilCorrect ? 'var(--primary-color)' : '#888';
        desc.style.fontWeight = isRepeatUntilCorrect ? '700' : '400';
        renderCurrentView();
    }

    /* --- 2-A. 일반 모의고사 로직 --- */
    function resetExam(shouldRender = true) {
        examIndex = 0;
        examAnswers = {};
        isExamSubmitted = false;
        currentResultFilter = 'all';
        updateTopSubmitButton();
        if (shouldRender && currentMode === 'test' && !isRepeatUntilCorrect) renderExamCard();
    }

    function renderExamCard() {
        document.getElementById('test-active-box').style.display = 'flex';
        document.getElementById('result-wrapper').style.display = 'none';
        document.getElementById('repeat-complete-box').style.display = 'none';
        document.getElementById('instant-feedback').style.display = 'none';
        document.getElementById('test-retry-badge').style.display = 'none';
        updateTopSubmitButton();

        const card = allCards[examIndex];
        const qNum = card.qNum || (examIndex + 1);
        const parsed = splitQuestionAndOptions(card.front);
        const selectedLetter = examAnswers[qNum];

        document.getElementById('test-q-num').textContent = `NO. ${qNum}`;
        syncStarButtonsUI(qNum);
        document.getElementById('test-q-text').textContent = parsed.question;

        const optionsBox = document.getElementById('test-options-box');
        optionsBox.innerHTML = '';

        parsed.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.full;
            if (selectedLetter === opt.letter) btn.classList.add('selected');

            btn.onclick = () => {
                examAnswers[qNum] = opt.letter;
                renderExamCard();
            };
            optionsBox.appendChild(btn);
        });

        const answeredCount = Object.keys(examAnswers).length;
        document.getElementById('test-progress-text').textContent = `${examIndex + 1} / ${allCards.length}`;
        document.getElementById('test-sub-progress').textContent = `풀이 완료: ${answeredCount}문항 | ★ 별표: ${starredSet.size}개`;

        document.getElementById('btn-test-prev').disabled = examIndex === 0;
        document.getElementById('btn-test-next').disabled = examIndex === allCards.length - 1;
        document.getElementById('test-scroll-content').scrollTop = 0;
    }

    function submitExam() {
        isExamSubmitted = true;
        updateTopSubmitButton();
        renderResultScreen();
    }

    function renderResultScreen() {
        document.getElementById('test-active-box').style.display = 'none';
        document.getElementById('repeat-complete-box').style.display = 'none';
        document.getElementById('result-wrapper').style.display = 'flex';
        updateTopSubmitButton();

        let correctCount = 0;
        allCards.forEach((card, idx) => {
            const qNum = card.qNum || (idx + 1);
            if (examAnswers[qNum] === extractAnswerLetter(card.answer)) correctCount++;
        });

        const score = Math.round((correctCount / allCards.length) * 100);
        document.getElementById('score-title').textContent = `모의고사 결과: ${score}점`;
        document.getElementById('score-stats').textContent = `정답 ${correctCount} / ${allCards.length}문항 | ★ 별표 ${starredSet.size}개`;

        filterResults(currentResultFilter);
    }

    function filterResults(filterType) {
        currentResultFilter = filterType;
        document.getElementById('filter-all').classList.toggle('active', filterType === 'all');
        document.getElementById('filter-wrong').classList.toggle('active', filterType === 'wrong');
        document.getElementById('filter-star').classList.toggle('active', filterType === 'star');

        const listBox = document.getElementById('review-list');
        listBox.innerHTML = '';

        allCards.forEach((card, idx) => {
            const qNum = card.qNum || (idx + 1);
            const correctLetter = extractAnswerLetter(card.answer);
            const userChoice = examAnswers[qNum] || '미선택';
            const isCorrect = (userChoice === correctLetter);
            const isStarred = starredSet.has(qNum);

            if (filterType === 'wrong' && isCorrect) return;
            if (filterType === 'star' && !isStarred) return;

            const parsed = splitQuestionAndOptions(card.front);
            const itemDiv = document.createElement('div');
            itemDiv.className = `review-item ${isCorrect ? 'is-correct' : 'is-wrong'}`;

            itemDiv.innerHTML = `
                <div class="review-header">
                    <span style="font-weight:700; color:var(--primary-color);">NO. ${qNum} ${isStarred ? '★' : ''}</span>
                    <span class="badge-status ${isCorrect ? 'badge-correct' : 'badge-wrong'}">
                        ${isCorrect ? '정답' : '오답'}
                    </span>
                </div>
                <div class="review-q">${parsed.question}</div>
                <div class="review-choice">
                    <div>내 선택: <strong>${userChoice}</strong></div>
                    <div style="color:var(--primary-color); margin-top:4px;"><strong>${card.answer}</strong></div>
                </div>
                <div class="review-exp">${card.explanation}</div>
            `;
            listBox.appendChild(itemDiv);
        });

        if (listBox.innerHTML === '') {
            listBox.innerHTML = `<div style="text-align:center; padding:40px 0; color:#888;">해당 조건에 맞는 문제가 없습니다.</div>`;
        }
    }

    /* --- 2-B. 오답 맞힐 때까지 반복 모드 로직 --- */
    function resetRepeatMode(shouldRender = true) {
        repeatQueue = allCards.map((c, idx) => ({
            ...c,
            qNum: c.qNum || (idx + 1),
            isRetry: false,
            answered: false,
            userChoice: null
        }));
        repeatIndex = 0;
        masteredCount = 0;
        if (shouldRender && currentMode === 'test' && isRepeatUntilCorrect) renderRepeatCard();
    }

    function renderRepeatCard() {
        document.getElementById('result-wrapper').style.display = 'none';
        updateTopSubmitButton();

        if (masteredCount >= allCards.length) {
            document.getElementById('test-active-box').style.display = 'none';
            document.getElementById('repeat-complete-box').style.display = 'flex';
            return;
        }

        document.getElementById('test-active-box').style.display = 'flex';
        document.getElementById('repeat-complete-box').style.display = 'none';

        const item = repeatQueue[repeatIndex];
        const parsed = splitQuestionAndOptions(item.front);
        const correctLetter = extractAnswerLetter(item.answer);

        document.getElementById('test-q-num').textContent = `NO. ${item.qNum}`;
        document.getElementById('test-retry-badge').style.display = item.isRetry ? 'inline-block' : 'none';
        syncStarButtonsUI(item.qNum);

        document.getElementById('test-q-text').textContent = parsed.question;

        const optionsBox = document.getElementById('test-options-box');
        const feedbackBox = document.getElementById('instant-feedback');
        optionsBox.innerHTML = '';
        feedbackBox.className = 'instant-feedback';
        feedbackBox.style.display = 'none';

        parsed.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.full;

            if (item.answered) {
                btn.disabled = true;
                if (opt.letter === correctLetter) btn.classList.add('correct');
                else if (opt.letter === item.userChoice) btn.classList.add('wrong');
            } else {
                btn.onclick = () => handleRepeatAnswer(opt.letter, correctLetter);
            }
            optionsBox.appendChild(btn);
        });

        if (item.answered) {
            const isCorrect = (item.userChoice === correctLetter);
            feedbackBox.style.display = 'block';
            if (isCorrect) {
                feedbackBox.className = 'instant-feedback show-correct';
                feedbackBox.innerHTML = `<strong>정답입니다!</strong><br><br>${item.explanation}`;
            } else {
                feedbackBox.className = 'instant-feedback show-wrong';
                feedbackBox.innerHTML = `<strong>오답입니다. (뒤에서 다시 출제됩니다)</strong><br>${item.answer}<br><br>${item.explanation}`;
            }
        }

        document.getElementById('test-progress-text').textContent = `${repeatIndex + 1} / ${repeatQueue.length}`;
        document.getElementById('test-sub-progress').textContent = `완벽 숙지: ${masteredCount} / ${allCards.length}문제`;

        document.getElementById('btn-test-prev').disabled = repeatIndex === 0;
        document.getElementById('btn-test-next').disabled = repeatIndex === repeatQueue.length - 1;
        document.getElementById('test-scroll-content').scrollTop = 0;
    }

    function handleRepeatAnswer(selectedLetter, correctLetter) {
        const item = repeatQueue[repeatIndex];
        if (item.answered) return;

        item.answered = true;
        item.userChoice = selectedLetter;
        const isCorrect = (selectedLetter === correctLetter);

        if (isCorrect) {
            masteredCount++;
        } else {
            repeatQueue.push({
                ...allCards.find((c, idx) => (c.qNum || (idx + 1)) === item.qNum),
                qNum: item.qNum,
                isRetry: true,
                answered: false,
                userChoice: null
            });
        }
        renderRepeatCard();
    }

    /* =========================================
       네비게이션 (학습모드 스와이프 / 테스트모드 버튼 전용)
       ========================================= */
    function nextCard() {
        if (currentMode === 'study') {
            if (studyIndex < studyList.length - 1) {
                studyIndex++;
                renderStudyCard();
            }
        } else if (isRepeatUntilCorrect) {
            if (repeatIndex < repeatQueue.length - 1) {
                repeatIndex++;
                renderRepeatCard();
            }
        } else if (!isExamSubmitted) {
            if (examIndex < allCards.length - 1) {
                examIndex++;
                renderExamCard();
            }
        }
    }

    function prevCard() {
        if (currentMode === 'study') {
            if (studyIndex > 0) {
                studyIndex--;
                renderStudyCard();
            }
        } else if (isRepeatUntilCorrect) {
            if (repeatIndex > 0) {
                repeatIndex--;
                renderRepeatCard();
            }
        } else if (!isExamSubmitted) {
            if (examIndex > 0) {
                examIndex--;
                renderExamCard();
            }
        }
    }

    // 스와이프는 '학습 모드'에서만 동작하며, 상하 스크롤과 충돌하지 않도록 수평 이동량이 수직 이동량보다 클 때만 작동
    let touchstartX = 0; let touchstartY = 0;
    studyWrapper.addEventListener('touchstart', e => {
        if (currentMode !== 'study') return;
        touchstartX = e.changedTouches[0].screenX;
        touchstartY = e.changedTouches[0].screenY;
    }, {passive: true});
    
    studyWrapper.addEventListener('touchend', e => {
        if (currentMode !== 'study') return;
        const diffX = e.changedTouches[0].screenX - touchstartX;
        const diffY = e.changedTouches[0].screenY - touchstartY;
        // 수평 스와이프 거리가 60px 이상이고, 수직 스크롤 거리보다 명확히 클 때만 카드 이동
        if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
            if (diffX < 0) nextCard();
            else prevCard();
        }
    }, {passive: true});

    document.addEventListener('keydown', (e) => {
        if (document.getElementById('import-modal').style.display === 'flex') return;
        if (e.key === 'ArrowRight') nextCard();
        if (e.key === 'ArrowLeft') prevCard();
        if (e.key === ' ' && currentMode === 'study') {
            e.preventDefault();
            flipCard();
        }
    });

    function openModal() {
        document.getElementById('import-modal').style.display = 'flex';
        document.getElementById('error-msg').style.display = 'none';
        document.getElementById('json-input').value = '';
    }
    function closeModal() {
        document.getElementById('import-modal').style.display = 'none';
    }
    function saveData() {
        const input = document.getElementById('json-input').value.trim();
        if (!input) return;
        try {
            const parsed = JSON.parse(input);
            if (Array.isArray(parsed) && parsed.length > 0) {
                allCards = parsed;
                initApp();
                closeModal();
                return;
            }
        } catch (e) {}
        document.getElementById('error-msg').style.display = 'block';
    }

    window.onload = loadData;
</script>

</body>
</html>
